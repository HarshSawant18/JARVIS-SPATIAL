<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JARVIS Rear Camera Hand Tracking</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;

            font-family: Arial, sans-serif;
        }


        /* =========================================
           REAR CAMERA
           ========================================= */

        #camera {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            /* IMPORTANT:
               Rear camera is NOT mirrored.
            */
        }


        /* =========================================
           HAND LANDMARK OVERLAY
           ========================================= */

        #overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            /* IMPORTANT:
               No mirror for rear camera.
            */
        }


        /* =========================================
           TOP UI
           ========================================= */

        #ui {

            position: fixed;

            top: 20px;
            left: 0;

            width: 100%;

            text-align: center;

            z-index: 10;

            pointer-events: none;
        }


        #status {

            display: inline-block;

            color: white;

            background: rgba(0, 0, 0, 0.65);

            padding: 10px 16px;

            border-radius: 12px;

            font-size: 16px;
        }


        #startCamera {

            margin-top: 12px;

            padding: 14px 24px;

            font-size: 18px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            pointer-events: auto;
        }


        /* =========================================
           BOTTOM INFO
           ========================================= */

        #info {

            position: fixed;

            bottom: 20px;

            left: 20px;
            right: 20px;

            color: white;

            background: rgba(0, 0, 0, 0.55);

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;

            z-index: 10;
        }

    </style>

</head>


<body>


    <!-- =========================================
         CAMERA
         ========================================= -->

    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>


    <!-- =========================================
         HAND LANDMARKS
         ========================================= -->

    <canvas
        id="overlay"
    ></canvas>


    <!-- =========================================
         UI
         ========================================= -->

    <div id="ui">

        <div id="status">
            Ready
        </div>

        <br>

        <button
            id="startCamera"
        >
            START HAND TRACKING
        </button>

    </div>


    <div id="info">

        Rear camera hand tracking

        <br>

        Move your hand left/right and verify
        the landmarks follow it correctly.

        <br>

        🤏 Thumb + index = pinch

    </div>


    <script
        type="module"
        src="./app.js"
    ></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JARVIS Spatial</title>

    <style>

        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }

        #status {
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 10px;
            display: inline-block;
        }

        #startAR {
            pointer-events: auto;
            margin-top: 10px;
            padding: 14px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
        }

    </style>

</head>


<body>

    <div id="ui">

        <div id="status">
            Checking AR...
        </div>

        <br>

        <button id="startAR">
            START AR
        </button>

    </div>


    <script type="module" src="./app.js"></script>

</body>

</html>

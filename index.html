<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JARVIS Hand Test</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #camera {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transform: scaleX(-1);
        }

        #overlay {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;
        }

        #ui {
            position: fixed;

            top: 20px;
            left: 0;

            width: 100%;

            text-align: center;

            z-index: 10;

            pointer-events: none;
        }

        #status {
            display: inline-block;

            color: white;

            background: rgba(0, 0, 0, 0.65);

            padding: 10px 16px;

            border-radius: 12px;

            font-size: 16px;
        }

        #startCamera {
            margin-top: 12px;

            padding: 14px 24px;

            font-size: 18px;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            pointer-events: auto;
        }

        #info {
            position: fixed;

            bottom: 20px;
            left: 20px;
            right: 20px;

            color: white;

            background: rgba(0, 0, 0, 0.55);

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            font-size: 14px;
        }

    </style>

</head>

<body>

    <video
        id="camera"
        autoplay
        playsinline
        muted
    ></video>

    <canvas
        id="overlay"
    ></canvas>

    <div id="ui">

        <div id="status">
            Ready
        </div>

        <br>

        <button id="startCamera">
            START HAND TRACKING
        </button>

    </div>

    <div id="info">
        Show one or two hands to the camera.
        Bring thumb + index finger together to test pinch.
    </div>

    <script type="module" src="./app.js"></script>

</body>

</html>
